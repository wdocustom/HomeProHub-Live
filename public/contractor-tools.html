<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/command-center.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Command Center...</title>
  <script>
    // Immediate redirect with preserved query params
    (function() {
      const params = window.location.search;
      const hash = window.location.hash;
      window.location.replace('/command-center.html' + params + hash);
    })();
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Redirecting to Command Center...</h1>
    <p>The Contractor Tools page has been split into focused pages for a better experience.</p>
    <p>If you are not redirected automatically, <a href="/command-center.html">click here</a>.</p>
  </div>
</body>
</html>
