<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sanctuary-zone" content="B">
  <title>Sign In – HomeProHub</title>

  <!-- Sanctuary Glass 2.0 -->
  <link rel="stylesheet" href="/components/sanctuary-glass.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase Auth -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/services/auth.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Segoe UI Symbol', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .auth-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 440px;
      width: 100%;
      padding: 48px 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo a {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 15px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      transition: all 0.2s;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 14px 24px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .status-message {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .status-message.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }

    .status-message.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .divider {
      text-align: center;
      margin: 28px 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e5e7eb;
    }

    .divider span {
      position: relative;
      background: white;
      padding: 0 16px;
      color: #6b7280;
      font-size: 14px;
    }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 15px;
      color: #6b7280;
    }

    .signup-link a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      text-align: center;
      margin-top: 20px;
    }

    .back-home a {
      color: #6b7280;
      text-decoration: none;
      font-size: 14px;
    }

    .back-home a:hover {
      color: #374151;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans antialiased opacity-0 transition-opacity duration-300">

  <!-- Navigation Header Container (Auto-injected by AppController) -->
  <div id="main-header-container" class="w-full z-50 relative"></div>

  <!-- Main Content Area (Centered Form) -->
  <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-10">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden p-8">

      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Welcome Back</h1>
        <p class="text-slate-500 mt-2">Sign in to your account</p>
      </div>

      <form id="signin-form" class="space-y-6">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email</label>
          <input type="email" id="email" class="w-full rounded-xl border-slate-200 bg-slate-50 p-3 font-semibold text-slate-900 focus:ring-blue-500" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
          <input type="password" id="password" class="w-full rounded-xl border-slate-200 bg-slate-50 p-3 font-semibold text-slate-900 focus:ring-blue-500" required>
        </div>

        <div id="auth-error" class="hidden text-red-500 text-sm text-center font-bold bg-red-50 p-3 rounded-lg"></div>

        <button type="submit" id="signin-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all">
          Sign In
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-slate-500">
        Don't have an account? <a href="/signup.html" class="font-bold text-blue-600 hover:text-blue-700">Sign up</a>
      </div>

      <div class="mt-4 text-center">
        <a href="/" class="text-xs font-bold text-slate-400 hover:text-slate-600">← Back to Home</a>
      </div>
    </div>
  </main>

  <!-- Mobile Navigation Container (Auto-injected by AppController) -->
  <div id="mobile-nav-container"></div>

  <script>
    let isLoading = false;

    // Display messages
    function displayError(message) {
      const errorEl = document.getElementById('auth-error');
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }

    function clearStatus() {
      const errorEl = document.getElementById('auth-error');
      errorEl.classList.add('hidden');
      errorEl.textContent = '';
    }

    // Loading state
    function setLoading(loading) {
      isLoading = loading;
      const button = document.getElementById('signin-btn');
      const inputs = document.querySelectorAll('#signin-form input');

      button.disabled = loading;
      inputs.forEach(input => input.disabled = loading);

      if (loading) {
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing In...';
      } else {
        button.textContent = 'Sign In';
      }
    }

    // Handle form submission
    document.getElementById('signin-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (isLoading) return;

      clearStatus();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        displayError('Please enter both email and password.');
        return;
      }

      if (password.length < 6) {
        displayError('Password must be at least 6 characters.');
        return;
      }

      setLoading(true);

      try {
        // Wait for auth service to be ready (with 10s timeout)
        if (!window.authService || !window.authService.initialized) {
          console.log('⏳ Waiting for auth service to initialize...');
          await new Promise((resolve, reject) => {
            let elapsed = 0;
            const checkAuth = setInterval(() => {
              elapsed += 100;
              if (window.authService && window.authService.initialized) {
                console.log('✓ Auth service ready after', elapsed, 'ms');
                clearInterval(checkAuth);
                resolve();
              } else if (elapsed >= 10000) {
                clearInterval(checkAuth);
                reject(new Error('Auth service failed to initialize within 10 seconds. Check console for errors.'));
              }
            }, 100);
          });
        }

        console.log('✓ Auth service ready, calling signIn...');
        const result = await window.authService.signIn(email, password);
        console.log('SignIn result:', result);

        if (result.success) {
          // Get correct dashboard URL based on user role
          const userRole = result.profile?.role || 'homeowner';
          const dashboardUrl = userRole === 'contractor' ? '/contractor-dashboard.html' : '/home.html';
          console.log(`✓ Sign-in success - role: ${userRole}, redirecting to: ${dashboardUrl}`);

          // IMMEDIATE REDIRECT: Don't wait for auth state change, redirect now
          setTimeout(() => {
            console.log('Executing redirect now...');
            window.location.href = dashboardUrl;
          }, 300);
        } else {
          console.error('SignIn failed:', result.error);
          displayError(result.error || 'Sign in failed. Please check your credentials.');
          setLoading(false);
        }
      } catch (error) {
        console.error('Sign in error:', error);
        displayError('An error occurred. Please try again.');
        setLoading(false);
      }
    });
  </script>

  <!-- Application Controller (MUST BE LAST) -->
  <script type="module" src="/js/app-controller.js"></script>

</body>
</html>
