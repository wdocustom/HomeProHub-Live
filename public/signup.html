<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sanctuary-zone" content="B">
  <title>Sign Up – HomeProHub</title>

  <link rel="stylesheet" href="/components/sanctuary-glass.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Preserved Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .auth-container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); max-width: 540px; width: 100%; padding: 48px 40px; }
    .role-option { padding: 20px; border: 2px solid #e5e7eb; border-radius: 12px; cursor: pointer; transition: all 0.2s; text-align: center; }
    .role-option:hover { border-color: #3b82f6; background: #eff6ff; }
    .role-option.active { border-color: #3b82f6; background: #eff6ff; }
    .role-specific-fields { display: none; }
    .role-specific-fields.active { display: block; }
    input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
    .btn-primary { width: 100%; padding: 14px 24px; background: #3b82f6; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col font-sans antialiased opacity-0 transition-opacity duration-300">

  <div id="main-header-container" class="w-full z-50 relative"></div>

  <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-10" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
    
    <div class="auth-container">
      <div class="logo mb-8 text-center">
         <a href="/" class="text-2xl font-extrabold text-slate-900 no-underline">HomeProHub</a>
      </div>

      <h1 id="pageTitle" class="text-2xl font-bold text-slate-900 text-center mb-2">Create Account</h1>
      <p id="pageSubtitle" class="text-slate-500 text-center mb-8">Join HomeProHub to get started</p>

      <div id="roleSelector" class="grid grid-cols-2 gap-4 mb-8">
        <div class="role-option" data-role="homeowner">
          <div class="text-3xl mb-2">🏠</div>
          <div class="font-bold text-slate-900">Homeowner</div>
        </div>
        <div class="role-option" data-role="contractor">
          <div class="text-3xl mb-2">🔧</div>
          <div class="font-bold text-slate-900">Contractor</div>
        </div>
      </div>

      <div id="statusMessage" class="hidden p-3 rounded-lg text-sm mb-4 text-center"></div>

      <div id="emailConfirmationCard" style="display: none;" class="bg-emerald-50 border-2 border-emerald-400 rounded-2xl p-8 text-center mb-6">
        <div class="text-6xl mb-4">📧</div>
        <h2 class="text-xl font-bold text-emerald-800 mb-2">Check Your Email!</h2>
        <p class="text-emerald-700 mb-4">We sent a confirmation link to <strong id="confirmEmail"></strong></p>
      </div>

      <form id="signupForm" class="space-y-4">
        <div class="form-group mb-4">
          <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
          <input type="email" id="email" class="w-full rounded-lg border-slate-200 p-3" required>
        </div>
        <div class="form-group mb-4">
          <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
          <input type="password" id="password" class="w-full rounded-lg border-slate-200 p-3" required minlength="6">
        </div>
        <div class="form-group mb-4">
          <label class="block text-sm font-bold text-slate-700 mb-2">Full Name</label>
          <input type="text" id="name" class="w-full rounded-lg border-slate-200 p-3" required>
        </div>

        <div id="homeownerFields" class="role-specific-fields space-y-4">
          <div class="form-group mb-4">
            <label class="block text-sm font-bold text-slate-700 mb-2">Phone</label>
            <input type="tel" id="phone" class="w-full rounded-lg border-slate-200 p-3">
          </div>
          <div class="form-group mb-4">
            <label class="block text-sm font-bold text-slate-700 mb-2">Zip Code</label>
            <input type="text" id="zipCode" class="w-full rounded-lg border-slate-200 p-3">
          </div>
        </div>

        <div id="contractorFields" class="role-specific-fields space-y-4">
          <div class="form-group mb-4">
            <label class="block text-sm font-bold text-slate-700 mb-2">Business Name</label>
            <input type="text" id="businessName" class="w-full rounded-lg border-slate-200 p-3">
          </div>
          <div class="form-group mb-4">
            <label class="block text-sm font-bold text-slate-700 mb-2">Primary Trade</label>
            <select id="trade" class="w-full rounded-lg border-slate-200 p-3 bg-white">
              <option value="">Select trade...</option>
              <option value="general">General Contractor</option>
              <option value="plumber">Plumber</option>
              <option value="electrician">Electrician</option>
              <option value="hvac">HVAC</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submitButton" class="btn-primary">
          Create Account
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-slate-500">
        Already have an account? <a href="/signin.html" class="font-bold text-blue-600 hover:text-blue-700">Sign in</a>
      </div>
      <div class="mt-4 text-center">
        <a href="/" class="text-xs font-bold text-slate-400 hover:text-slate-600">← Back to Home</a>
      </div>
    </div>
  </main>

  <div id="mobile-nav-container"></div>

  <script type="module" src="/js/app-controller.js"></script>

  <script>
    let selectedRole = null;
    
    // Role Selection Logic
    document.querySelectorAll('.role-option').forEach(option => {
      option.addEventListener('click', function() {
        document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('active'));
        document.querySelectorAll('.role-specific-fields').forEach(f => f.classList.remove('active'));
        
        this.classList.add('active');
        selectedRole = this.dataset.role;
        
        const fields = document.getElementById(selectedRole + 'Fields');
        if(fields) fields.classList.add('active');
      });
    });

    // Handle Signup
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitButton');
      const status = document.getElementById('statusMessage');
      
      if (!selectedRole) return alert("Please select a role (Homeowner or Contractor)");
      
      // Loading State
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';
      btn.disabled = true;

      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value;
        const payload = { role: selectedRole, name: name };
        
        if(selectedRole === 'homeowner') payload.zip_code = document.getElementById('zipCode').value;
        if(selectedRole === 'contractor') payload.business_name = document.getElementById('businessName').value;

        // Use the global Controller's auth service
        if (!window.authService) throw new Error("System initializing... try again.");
        
        const result = await window.authService.signUp(email, password, payload);
        
        if (result.success) {
           document.getElementById('signupForm').style.display = 'none';
           document.getElementById('roleSelector').style.display = 'none';
           document.getElementById('emailConfirmationCard').style.display = 'block';
           document.getElementById('confirmEmail').innerText = email;
        } else {
           status.innerText = result.error || "Signup failed.";
           status.className = "bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 text-center block";
           btn.innerHTML = 'Create Account';
           btn.disabled = false;
        }

      } catch (err) {
        console.error(err);
        btn.innerHTML = 'Create Account';
        btn.disabled = false;
        alert("Error: " + err.message);
      }
    });
  </script>
  
  <noscript><style>body { opacity: 1 !important; }</style></noscript>
</body>
</html>
