<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WDO Builder Tool v44</title>
    <style>
        :root {
            --bg-body: #f8fafc;       
            --bg-card: #ffffff;       
            --accent: #2563eb;        
            --accent-hover: #1d4ed8;
            --text-main: #0f172a;     
            --text-muted: #64748b;
            --wood-fill: #e2b686;
            --wood-stroke: #925f32;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 30px; }
        .controls-area { flex: 1; min-width: 340px; max-width: 450px; }
        .visual-area { flex: 2; min-width: 320px; }

        /* HEADER */
        .header-section { width: 100%; margin-bottom: 30px; text-align: center; }
        h1 { margin: 0; font-size: 2rem; font-weight: 800; color: var(--text-main); letter-spacing: -1px; }
        .brand-accent { color: var(--accent); }
        .subtitle { font-size: 1rem; color: var(--text-muted); margin-top: 5px; font-weight: 500; }

        /* CARDS */
        .card { 
            background: var(--bg-card); padding: 25px; border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        /* AUTO FIT BOX */
        .autofit-box {
            background: #eff6ff; 
            border: 2px dashed #bfdbfe;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .autofit-title { font-weight: 800; color: var(--accent); font-size: 0.9rem; margin-bottom: 10px; display:flex; align-items:center; gap:8px; }
        .btn-calc {
            background: var(--accent); color: white; border: none; width: 100%;
            padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer;
            margin-top: 10px; transition: background 0.2s;
        }
        .btn-calc:hover { background: var(--accent-hover); }

        /* 2D CANVAS STAGE */
        .drawing-container {
            width: 100%; 
            aspect-ratio: 4/3; 
            background-color: #ffffff;
            background-image: 
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 16px; border: 1px solid #cbd5e1;
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        
        canvas { width: 100%; height: 100%; display: block; }

        /* DYNAMIC DIMENSIONS TEXT */
        .dimensions-display {
            text-align: center; margin-top: 15px; font-size: 0.9rem; 
            font-weight: 500; color: var(--text-muted); background: #f8fafc; 
            padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;
        }

        /* INPUTS */
        label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group { margin-bottom: 20px; }
        
        input[type="number"], select {
            width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #e2e8f0;
            font-size: 1rem; font-weight: 600; color: var(--text-main); background: #f8fafc;
            transition: border 0.2s; box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); background: #fff; }

        .helper-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; line-height: 1.4; font-style: italic; }

        /* TOGGLES */
        .toggle-row { 
            display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; 
            padding: 8px 12px; border-radius: 8px; border: 1px solid transparent; transition: all 0.2s; 
        }
        .toggle-row:hover { background: #f1f5f9; border-color: #e2e8f0; }
        .toggle-row input { width: 20px; height: 20px; margin-right: 12px; accent-color: var(--accent); cursor: pointer; }
        .toggle-row span { font-size: 0.95rem; font-weight: 500; color: var(--text-main); }

        /* PRICE & ADD BUTTON */
        .action-row { display: flex; align-items: center; gap: 15px; margin-top: 20px; }
        
        .unit-price { flex: 1; text-align: center; font-size: 1.5rem; font-weight: 800; color: var(--text-main); }
        .unit-price span { display: block; font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .btn-add {
            flex: 2; background: white; color: var(--accent); border: 2px solid var(--accent);
            padding: 12px; border-radius: 8px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-add:hover { background: #eff6ff; }

        /* ORDER SUMMARY LIST */
        .order-list { list-style: none; padding: 0; margin: 0; }
        .order-item { 
            background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; 
            border-radius: 8px; margin-bottom: 10px; display: flex; 
            justify-content: space-between; align-items: center; 
        }
        .item-details { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
        .item-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .item-actions { display: flex; align-items: center; gap: 15px; }
        .item-price { font-weight: 700; font-size: 1rem; }
        .btn-remove { color: var(--danger); background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0 5px; }

        /* GRAND TOTAL AREA */
        .grand-total-box { margin-top: 20px; border-top: 2px dashed #e2e8f0; padding-top: 20px; text-align: center; }
        .gt-label { font-size: 0.8rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
        .gt-val { font-size: 2.5rem; font-weight: 900; color: var(--text-main); line-height: 1; margin: 5px 0 15px 0; }

        .btn-email {
            width: 100%; background: var(--accent); color: white; border: none;
            padding: 16px; border-radius: 10px; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s;
        }
        .btn-email:hover { background: var(--accent-hover); transform: translateY(-2px); }

        @media (max-width: 768px) {
            .container { flex-direction: column-reverse; }
        }
    </style>
</head>
<body>

<div class="header-section">
    <h1>WDO <span class="brand-accent">Custom</span></h1>
    <div class="subtitle">Builder Configuration Tool</div>
</div>

<div class="container">
    
    <div class="controls-area">
        
        <div class="autofit-box">
            <div class="autofit-title">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                AUTO-FIT WALL CALCULATOR
            </div>
            <div style="display:flex; gap:10px;">
                <div style="flex:1">
                    <label>Wall Width (inches)</label>
                    <input type="number" id="wall_w" placeholder="e.g. 100">
                </div>
                <div style="flex:1">
                    <label>Wall Height (inches)</label>
                    <input type="number" id="wall_h" placeholder="e.g. 96">
                </div>
            </div>
            <button class="btn-calc" onclick="calculateWallFit()">Find Max Size &rarr;</button>
        </div>

        <div class="card">
            <div style="font-size:0.85rem; font-weight:800; text-transform:uppercase; color:#94a3b8; margin-bottom:15px; border-bottom:1px solid #e2e8f0; padding-bottom:5px;">
                Manual Configuration
            </div>

            <div class="input-group">
                <label>Dimensions</label>
                <div style="display:flex; gap:15px;">
                    <div style="flex:1">
                        <input type="number" id="in_cols" value="4" min="1" max="12" oninput="updateVisual()">
                        <div style="font-size:0.65rem; font-weight:700; color:var(--text-muted); text-align:center; margin-top:6px;">COLUMNS</div>
                    </div>
                    <div style="flex:1">
                        <input type="number" id="in_rows" value="4" min="1" max="10" oninput="updateVisual()">
                        <div style="font-size:0.65rem; font-weight:700; color:var(--text-muted); text-align:center; margin-top:6px;">TIERS HIGH</div>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Tote Model</label>
                <select id="in_tote" onchange="updateVisual()">
                    <option value="HDX">HDX / Standard (19.6" Wide)</option>
                    <option value="GM">Greenmade / Large (20.6" Wide)</option>
                </select>
                <div class="helper-text">*Have your own? Measure top width rim-to-rim. Select closest size.</div>
            </div>

            <div style="margin-top:20px;">
                <label class="toggle-row">
                    <input type="checkbox" id="in_totes" checked onchange="updateVisual()">
                    <span>Show Totes (+$12 ea)</span>
                </label>
                <label class="toggle-row">
                    <input type="checkbox" id="in_wheels" checked onchange="updateVisual()">
                    <span>Add Wheels (+$45)</span>
                </label>
                <label class="toggle-row">
                    <input type="checkbox" id="in_top" checked onchange="updateVisual()">
                    <span>Plywood Top (+$75)</span>
                </label>
            </div>

            <div class="action-row">
                <div class="unit-price">
                    <span id="current_unit_price">$0</span>
                    <span>Current Unit</span>
                </div>
                <button class="btn-add" onclick="addUnitToList()">+ Add to Quote</button>
            </div>
        </div>

        <div class="card" id="order_card" style="display:none;">
            <div style="font-size:0.85rem; font-weight:800; text-transform:uppercase; color:#94a3b8; margin-bottom:15px;">
                Your Quote List
            </div>
            
            <ul class="order-list" id="order_list_dom">
                </ul>

            <div class="grand-total-box">
                <div class="gt-label">Estimated Grand Total</div>
                <div class="gt-val" id="grand_total">$0</div>
                <button class="btn-email" onclick="sendEmail()">Send Order Inquiry</button>
            </div>
        </div>

    </div>

    <div class="visual-area">
        <div class="drawing-container">
            <canvas id="blueprint" width="1200" height="900"></canvas>
        </div>
        <div class="dimensions-display" id="dim_text">Loading...</div>
    </div>

</div>

<script>
    const myEmail = "camachoskyler@gmail.com"; 
    
    // State
    let orderItems = [];
    let currentConfig = {}; 

    function calculateWallFit() {
        const wallW = parseFloat(document.getElementById('wall_w').value);
        const wallH = parseFloat(document.getElementById('wall_h').value);
        const toteType = document.getElementById('in_tote').value;

        if(!wallW || !wallH) {
            alert("Please enter both wall width and height in inches.");
            return;
        }

        const opening = (toteType.includes('HDX')) ? 19.75 : 20.75;
        const stud = 1.5;
        
        // SOLVE WIDTH: Max Cols = (Wall - Stud) / (Opening + Stud)
        // W = CO + CS + S  ->  W - S = C(O + S)
        let maxCols = Math.floor((wallW - stud) / (opening + stud));
        
        // SOLVE HEIGHT: Max Rows = (Wall - 3 - 2.5) / 16
        // H = 16R + 5.5
        let maxRows = Math.floor((wallH - 5.5) / 16);

        if(maxCols < 1) maxCols = 1;
        if(maxRows < 1) maxRows = 1;

        // Update Inputs
        document.getElementById('in_cols').value = maxCols;
        document.getElementById('in_rows').value = maxRows;
        
        // Trigger visual update
        updateVisual();
        
        // Feedback
        alert(`We can fit a ${maxCols} Wide x ${maxRows} High unit in that space!`);
    }

    function updateVisual() {
        const cols = parseInt(document.getElementById('in_cols').value) || 1;
        const rows = parseInt(document.getElementById('in_rows').value) || 1;
        const toteTypeRaw = document.getElementById('in_tote').value;
        const hasTotes = document.getElementById('in_totes').checked;
        const hasWheels = document.getElementById('in_wheels').checked;
        const hasTop = document.getElementById('in_top').checked;

        // MATH
        const opening = (toteTypeRaw.includes('HDX')) ? 19.75 : 20.75;
        const stud = 1.5; 
        const totalW_in = (cols * opening) + ((cols+1) * stud); 
        const topGap = 2.5;
        const totalH_in = (rows * 16) + 3 + topGap; 
        
        // PRICING
        const slots = cols * rows;
        let price = slots * 40;
        if(hasTotes) price += (slots * 12);
        if(hasWheels) price += 45;
        let topSheets = 0;
        if(totalW_in > 192) topSheets = 3;
        else if(totalW_in > 96) topSheets = 2;
        else topSheets = 1;
        if(hasTop) price += (topSheets * 75);

        // Update UI
        document.getElementById('current_unit_price').innerText = "$" + price.toLocaleString();
        const dimStr = `Visualizing: ${totalW_in.toFixed(0)}" Width  ×  ${totalH_in.toFixed(0)}" Height  ×  30" Depth`;
        document.getElementById('dim_text').innerText = dimStr;

        // Store current config
        currentConfig = {
            cols, rows, toteTypeRaw, hasTotes, hasWheels, hasTop, 
            price, totalW_in, totalH_in,
            desc: `${cols} Wide x ${rows} High`
        };

        // Draw
        drawBlueprint(cols, rows, opening, hasTotes, hasWheels, hasTop, totalW_in, totalH_in, topGap);
    }

    function addUnitToList() {
        orderItems.push({...currentConfig}); 
        renderList();
        document.getElementById('order_card').style.display = 'block';
    }

    function removeUnit(index) {
        orderItems.splice(index, 1);
        renderList();
        if(orderItems.length === 0) {
            document.getElementById('order_card').style.display = 'none';
        }
    }

    function renderList() {
        const listEl = document.getElementById('order_list_dom');
        listEl.innerHTML = "";
        let grandTotal = 0;

        orderItems.forEach((item, index) => {
            grandTotal += item.price;
            
            // Build sub-description
            let extras = [];
            if(item.hasTotes) extras.push("W/ Totes");
            if(item.hasWheels) extras.push("Wheels");
            if(item.hasTop) extras.push("Top");
            const extraStr = extras.length > 0 ? extras.join(", ") : "Frame Only";

            const li = document.createElement('li');
            li.className = 'order-item';
            li.innerHTML = `
                <div>
                    <div class="item-details">Unit #${index+1}: ${item.desc}</div>
                    <div class="item-sub">${extraStr}</div>
                </div>
                <div class="item-actions">
                    <div class="item-price">$${item.price.toLocaleString()}</div>
                    <button class="btn-remove" onclick="removeUnit(${index})">&times;</button>
                </div>
            `;
            listEl.appendChild(li);
        });

        document.getElementById('grand_total').innerText = "$" + grandTotal.toLocaleString();
    }

    function drawBlueprint(cols, rows, bayWidth, showTotes, showWheels, showTop, realW, realH, topGap) {
        const canvas = document.getElementById('blueprint');
        const ctx = canvas.getContext('2d');
        const W = 1200;
        const H = 900;
        ctx.clearRect(0, 0, W, H);

        const woodFill = '#e2b686';
        const woodStroke = '#925f32';

        const margin = 60; 
        const safeW = W - (margin * 2);
        const safeH = H - (margin * 2);

        let visualH_in = realH;
        if(showWheels) visualH_in += 6;
        if(showTop) visualH_in += 1;

        const scale = Math.min(safeW / realW, safeH / visualH_in);

        const pTotalW = realW * scale;
        const pTotalH = realH * scale;
        const pStud = 1.5 * scale;
        const pBay = bayWidth * scale;
        const pPlate = 1.5 * scale;
        const pTopGap = topGap * scale;

        const startX = (W - pTotalW) / 2;
        const visualPixelH = visualH_in * scale;
        const startY = (H - visualPixelH) / 2 + (showTop ? 1*scale : 0);

        ctx.fillStyle = woodFill; ctx.strokeStyle = woodStroke; ctx.lineWidth = 2;

        // Plates
        ctx.fillRect(startX, startY + pTotalH - pPlate, pTotalW, pPlate);
        ctx.strokeRect(startX, startY + pTotalH - pPlate, pTotalW, pPlate);
        ctx.fillRect(startX, startY, pTotalW, pPlate);
        ctx.strokeRect(startX, startY, pTotalW, pPlate);

        // Posts
        const postH = pTotalH - (pPlate * 2);
        const postY = startY + pPlate;
        for(let i=0; i <= cols; i++) {
            const x = startX + (i * (pBay + pStud));
            ctx.fillRect(x, postY, pStud, postH);
            ctx.strokeRect(x, postY, pStud, postH);
        }

        // Rails & Totes
        const railH = 1.5 * scale; 
        const railW = 1.5 * scale; 

        for(let c=0; c < cols; c++) {
            const bayLeftX = startX + pStud + (c * (pBay + pStud));
            const bayRightX = bayLeftX + pBay;

            for(let r=1; r <= rows; r++) {
                const levelY = startY + pPlate + pTopGap + ((r-1) * 16 * scale);
                
                ctx.fillStyle = woodFill;
                ctx.fillRect(bayLeftX, levelY, railW, railH);
                ctx.strokeRect(bayLeftX, levelY, railW, railH);
                ctx.fillRect(bayRightX - railW, levelY, railW, railH);
                ctx.strokeRect(bayRightX - railW, levelY, railW, railH);

                if(showTotes) {
                    const tW = pBay * 0.94; 
                    const tH = 12 * scale;
                    const tX = bayLeftX + (pBay - tW)/2;
                    const tY = levelY; 
                    const lidH = 1.5 * scale;
                    
                    ctx.fillStyle = '#fbbf24'; ctx.strokeStyle = '#d97706';
                    ctx.fillRect(tX, tY - lidH, tW, lidH); ctx.strokeRect(tX, tY - lidH, tW, lidH);
                    
                    const bodyW = tW * 0.9; const bodyX = tX + (tW - bodyW)/2;
                    ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#0f172a';
                    ctx.fillRect(bodyX, tY, bodyW, tH); ctx.strokeRect(bodyX, tY, bodyW, tH);
                }
            }
        }

        if(showTop) {
            const topThick = 0.75 * scale;
            const overhang = 1 * scale;
            ctx.fillStyle = '#f3d2a3'; 
            ctx.fillRect(startX - overhang, startY - topThick, pTotalW + (overhang*2), topThick);
            ctx.strokeRect(startX - overhang, startY - topThick, pTotalW + (overhang*2), topThick);
        }

        if(showWheels) {
            const wSize = 5 * scale;
            const wY = startY + pTotalH;
            ctx.fillStyle = '#334155'; ctx.strokeStyle = '#1e293b';
            ctx.beginPath(); ctx.arc(startX + pStud*2, wY + wSize/2, wSize/2, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(startX + pTotalW - pStud*2, wY + wSize/2, wSize/2, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
        }
    }

    function sendEmail() {
        if(orderItems.length === 0) return alert("Please add at least one unit to your quote.");

        let body = "Hi WDO Custom,\n\nI would like to order the following:\n\n";
        let grandTotal = 0;

        orderItems.forEach((item, index) => {
            grandTotal += item.price;
            body += `UNIT #${index+1}:\n`;
            body += `Size: ${item.cols} Wide x ${item.rows} High\n`;
            body += `Tote Type: ${item.toteTypeRaw}\n`;
            body += `Includes: ${item.hasTotes ? 'Totes, ' : ''}${item.hasWheels ? 'Wheels, ' : ''}${item.hasTop ? 'Top' : ''}\n`;
            body += `Unit Price: $${item.price.toLocaleString()}\n`;
            body += `--------------------------------\n`;
        });

        body += `\nESTIMATED GRAND TOTAL: $${grandTotal.toLocaleString()}\n\nPlease contact me to finalize this order.`;
        
        window.location.href = `mailto:${myEmail}?subject=Multi-Unit Order Inquiry&body=${encodeURIComponent(body)}`;
    }

    // Init
    updateVisual();

</script>

</body>
</html>
